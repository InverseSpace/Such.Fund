[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"
script = "script"

# Solidity compiler settings
solc = "0.8.19"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false

# Testing settings
fuzz = { runs = 256 }
invariant = { runs = 256, depth = 15 }

# Formatting
[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

# Documentation
[doc]
out = "docs"
title = "Such.Fund Smart Contracts"

# RPC endpoints (for deployment and testing)
[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
localhost = "http://localhost:8545"

# Etherscan API keys (for contract verification)
[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}" }
arbitrum = { key = "${ARBISCAN_API_KEY}" }
